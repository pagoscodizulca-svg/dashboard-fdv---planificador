services:
  - type: web
    name: dashboard-fdv---planificador
    env: node
    plan: free
    branch: master
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: SHEETS_SYNC_INTERVAL_MS
        value: "60000"
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: SYNC_SECRET_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
